[pytest]
minversion = 7.0

addopts =
    --cov=rag_technical_app
    --cov=ingest
    --cov=query
    --cov-report=term-missing
    --cov-report=html
    -vv

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning:google\.protobuf

